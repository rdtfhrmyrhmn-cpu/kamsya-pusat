body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.62));pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.6}
.o1{width:420px;height:420px;top:-80px;left:6%;background:radial-gradient(circle,rgba(99,102,241,.28),transparent 70%)}
.o2{width:420px;height:420px;bottom:-40px;right:6%;background:radial-gradient(circle,rgba(255,214,0,.22),transparent 70%)}
.console{position:relative;z-index:1;width:100%;max-width:1020px;border-radius:26px;padding:clamp(20px,4vw,44px);
  background:var(--console);border:1px solid var(--border);
  backdrop-filter:blur(40px) saturate(200%) brightness(1.06);-webkit-backdrop-filter:blur(40px) saturate(200%) brightness(1.06);
  box-shadow:0 30px 70px rgba(0,0,0,.8),0 0 40px rgba(255,140,0,.10),inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 1px rgba(0,0,0,.35)}
.console::before{content:"";position:absolute;top:0;left:5%;right:5%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65) 25%,rgba(255,214,0,.5) 50%,rgba(255,255,255,.65) 75%,transparent)}
.chip{position:absolute;width:28px;height:28px;border:1.5px solid rgba(255,214,0,.35);box-shadow:0 0 12px var(--glow);pointer-events:none}
.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:26px}
.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:26px}
.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:26px}
.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:26px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:clamp(22px,4vw,38px)}
h1{font:700 clamp(1.9rem,5vw,3rem)/1.05 "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:0 0 8px}
.sub{margin:0;color:var(--t2);max-width:44ch}
.date{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--t2);
  background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:6px 12px}
.date i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.5vw,22px)}
.card{display:flex;flex-direction:column;gap:14px;min-height:290px;padding:clamp(18px,3vw,26px);border-radius:20px;color:inherit;text-decoration:none;
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);
  box-shadow:0 8px 24px -4px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.22);
  transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,214,0,.4);
  box-shadow:0 14px 32px rgba(0,0,0,.6),0 0 22px rgba(255,214,0,.14),inset 0 1px 1px rgba(255,255,255,.35)}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--gold);
  background:rgba(255,255,255,.06);border:1px solid var(--border);box-shadow:inset 0 1px 1px rgba(255,255,255,.2)}
.card h2{font:700 1.55rem/1.1 "Space Grotesk",sans-serif;margin:0;letter-spacing:-.02em}
.card p{margin:0;color:var(--t2);font-size:.95rem}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
li{font-size:.78rem;font-weight:600;color:var(--t2);background:rgba(255,255,255,.06);border:1px solid var(--border);padding:3px 10px;border-radius:99px}
.btn{margin-top:auto;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border-radius:12px;
  font-weight:700;font-size:.9rem;color:#08080a;background:linear-gradient(135deg,#ffd600,#ffaa00);box-shadow:0 0 16px rgba(255,214,0,.35);transition:box-shadow .25s}
.card:hover .btn{box-shadow:0 0 26px rgba(255,214,0,.6)}
footer{margin-top:clamp(18px,3vw,28px);color:var(--t3);font-size:.82rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:700px){.grid{grid-template-columns:1fr}.card{min-height:0}}
@media(prefers-reduced-motion:reduce){.card,.btn{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="console">
  <span class="chip tl"></span><span class="chip tr"></span><span class="chip bl"></span><span class="chip br"></span>
  <header>
    <div>
      <h1>Keuangan Kantin</h1>
      <p class="sub">Pilih cabang kantin untuk mencatat atau melihat keuangannya.</p>
    </div>
    <div class="date"><i></i><span id="date"></span></div>
  </header>
  <main class="grid" id="grid"></main>
  <footer><span>Kantin UIMSYA</span><span>2 cabang · putri dan putra</span></footer>
</div>
<script>
const wallet='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h12v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 9H7a4 4 0 0 0 0 8h14V9z"/><circle cx="16.5" cy="13" r="1"/></svg>';
const sites=[
 {name:"Kantin Putri",desc:"Catat dan lihat uang masuk dan keluar kantin putri.",tags:["Penjualan harian","Belanja bahan","Saldo kas"],url:"https://kantin-uimsya-putri.rdtfhrmyrhmn.workers.dev/app"},
 {name:"Kantin Putra",desc:"Catat dan lihat uang masuk dan keluar kantin putra.",tags:["Penjualan harian","Belanja bahan","Saldo kas"],url:"https://kantin-uimsya-putra.rdtfhrmyrhmn.workers.dev/app"}
];
const grid=document.getElementById("grid");
sites.forEach(s=>{
  const a=document.createElement("a");a.className="card";a.href=s.url;a.target="_blank";a.rel="noopener";
  a.innerHTML='<span class="ico">'+wallet+'</span><h2></h2><p></p><ul></ul><span class="btn">Buka keuangan <span aria-hidden="true">\u2192</span></span>';
  a.querySelector("h2").textContent=s.name;a.querySelector("p").textContent=s.desc;
  const ul=a.querySelector("ul");s.tags.forEach(t=>{const li=document.createElement("li");li.textContent=t;ul.appendChild(li)});
  grid.appendChild(a);
});
document.getElementById("date").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
</script>
